networks:
  dev-shared-network:
    external: true

services:
  dev_python_ai_node:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G
    volumes:
      # Tus mounts originales (mantengo exactamente igual)
      - ../develop:/workspaces
      - ../develop/vectorstore:/workspaces/vectorstore
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.gitconfig:/home/node/.gitconfig:ro
      - ~/.ssh:/home/node/.ssh:ro
      - ~/.config/gh:/home/node/.config/gh:ro
      - ./docker-data/claude/.claude.json:/home/node/.claude.json
      
      # ── Persistencia para historial de bash ───────────────────────────────
      - commandhistory:/commandhistory
      - claude-home:/home/node/.claude
      - codex-home:/home/node/.codex
      - cursor-home:/home/node/.cursor             # commands globales, hooks, etc.
      - npm-global:/home/node/.npm-global          # paquetes npm -g

    ports:
      - "4000-4010:4000-4010"
      - "5000-5010:5000-5010"
    command: sleep infinity
    environment:
      - PYTHONUNBUFFERED=1
    user: node
    networks:
      - dev-shared-network

volumes:
  # Nuevos volúmenes nombrados → estos sobreviven rebuilds
  commandhistory:
  claude-home:
  codex-home:
  cursor-home:
  npm-global:
  local-bin:

  # Si descomentaste los opcionales arriba, agrégalos aquí también
  # node-config:
  # node-cache:
  # node-npm: